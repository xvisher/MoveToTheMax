<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    RollPack Icon Sprite
    Usage: <svg><use href="assets/icons.svg#icon-roller" /></svg>
  -->

  <!-- Foam Roller icon -->
  <symbol id="icon-roller" viewBox="0 0 48 48" fill="none">
    <ellipse cx="24" cy="24" rx="8" ry="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 24 Q4 24 4 16 Q4 8 12 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M32 24 Q44 24 44 16 Q44 8 36 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="12" x2="16" y2="36" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="32" y1="12" x2="32" y2="36" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
  </symbol>

  <!-- Bag icon -->
  <symbol id="icon-bag" viewBox="0 0 48 48" fill="none">
    <rect x="10" y="18" width="28" height="22" rx="3" stroke="currentColor" stroke-width="2.5"/>
    <path d="M18 18V14a6 6 0 0 1 12 0v4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 28v4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="27" r="2" fill="currentColor"/>
  </symbol>

  <!-- Backpack straps icon -->
  <symbol id="icon-backpack" viewBox="0 0 48 48" fill="none">
    <path d="M16 8 Q16 24 16 40" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M32 8 Q32 24 32 40" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 12 Q24 6 32 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M16 22 Q20 26 24 24 Q28 22 32 26" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 38 Q24 44 30 38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <!-- Zipper icon -->
  <symbol id="icon-zipper" viewBox="0 0 48 48" fill="none">
    <path d="M8 24 Q8 12 24 12 Q40 12 40 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="8" cy="24" r="2.5" fill="currentColor"/>
    <circle cx="40" cy="24" r="2.5" fill="currentColor"/>
    <path d="M14 24 L34 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>
    <rect x="20" y="20" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- Detachable / quick-release icon -->
  <symbol id="icon-detach" viewBox="0 0 48 48" fill="none">
    <circle cx="24" cy="24" r="14" stroke="currentColor" stroke-width="2.5"/>
    <path d="M24 10 V6M24 38 V42M10 24 H6M38 24 H42" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="4" fill="currentColor"/>
  </symbol>

  <!-- Airplane / travel icon -->
  <symbol id="icon-travel" viewBox="0 0 48 48" fill="none">
    <path d="M6 34 L20 30 L28 42 L32 40 L26 26 L40 18 Q46 14 44 8 Q38 6 34 12 L20 26 L6 20 L4 24 L16 30 L6 34 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  </symbol>

  <!-- Weight / dumbbell icon -->
  <symbol id="icon-weight" viewBox="0 0 48 48" fill="none">
    <rect x="20" y="20" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2.5"/>
    <rect x="4" y="16" width="6" height="16" rx="3" stroke="currentColor" stroke-width="2.5"/>
    <rect x="38" y="16" width="6" height="16" rx="3" stroke="currentColor" stroke-width="2.5"/>
    <rect x="10" y="20" width="10" height="8" rx="1" stroke="currentColor" stroke-width="2.5"/>
    <rect x="28" y="20" width="10" height="8" rx="1" stroke="currentColor" stroke-width="2.5"/>
  </symbol>

  <!-- Shield / warranty icon -->
  <symbol id="icon-warranty" viewBox="0 0 48 48" fill="none">
    <path d="M24 4 L40 10 L40 26 Q40 36 24 44 Q8 36 8 26 L8 10 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M16 24 L21 29 L32 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Star / quality icon -->
  <symbol id="icon-star" viewBox="0 0 48 48" fill="none">
    <path d="M24 4 L28.8 17.6 L43.2 17.6 L31.6 26 L36.4 39.6 L24 31.2 L11.6 39.6 L16.4 26 L4.8 17.6 L19.2 17.6 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  </symbol>

  <!-- Check / verified icon -->
  <symbol id="icon-check" viewBox="0 0 48 48" fill="none">
    <circle cx="24" cy="24" r="19" stroke="currentColor" stroke-width="2.5"/>
    <path d="M14 24 L20 30 L34 16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 3D cube / print icon -->
  <symbol id="icon-3d" viewBox="0 0 48 48" fill="none">
    <path d="M24 4 L44 14 L44 34 L24 44 L4 34 L4 14 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M24 4 L24 44" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M4 14 L44 34" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M44 14 L4 34" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  </symbol>
</svg>
